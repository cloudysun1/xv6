[project]
name = "trend-hl"
version = "0.1.0"
description = "Production-grade trend-following quant trading system for Hyperliquid L1 DEX."
authors = [{ name = "Quant Engineer" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "hyperliquid-python-sdk>=0.10.0",
    "eth-account>=0.11.0",
    "websockets>=12.0",
    "aiohttp>=3.9.5",
    "httpx>=0.27.0",
    "polars>=1.0.0",
    "pyarrow>=16.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "numba>=0.59.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "orjson>=3.10.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvloop>=0.19.0; platform_system != 'Windows'",
    "winloop>=0.1.6; platform_system == 'Windows'",
    "prometheus-client>=0.20.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
]
backtest = [
    "matplotlib>=3.8.0",
    "quantstats>=0.0.62",
]

[project.scripts]
trend-hl = "trend_hl.app:cli"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_hl"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
